- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Ensure web root exists
  file:
    path: /var/www/site
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy index.html
  copy:
    src: index.html
    dest: /var/www/site/index.html
    owner: www-data
    group: www-data
    mode: '0644'

- name: Deploy nginx site config
  template:
    src: nginx_site.conf.j2
    dest: /etc/nginx/sites-available/diplom.conf

- name: Enable diplom site
  file:
    src: /etc/nginx/sites-available/diplom.conf
    dest: /etc/nginx/sites-enabled/diplom.conf
    state: link
    force: yes

- name: Disable default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Test nginx config
  command: nginx -t
  register: nginx_test
  failed_when: nginx_test.rc != 0

- name: Reload nginx
  service:
    name: nginx
    state: reloaded
