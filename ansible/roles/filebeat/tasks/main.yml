- name: Install Filebeat
  apt:
    name: filebeat
    state: present
    update_cache: yes

- name: Configure Filebeat for nginx logs
  copy:
    dest: /etc/filebeat/filebeat.yml
    content: |
      filebeat.inputs:
        - type: log
          enabled: true
          paths:
            - /var/log/nginx/access.log
            - /var/log/nginx/error.log

      output.elasticsearch:
        hosts: ["elastic.ru-central1.internal:9200"]

      setup.kibana:
        host: "kibana.ru-central1.internal:5601"
  notify: Restart Filebeat

- name: Enable nginx module for Filebeat
  command: filebeat modules enable nginx
  args:
    creates: /etc/filebeat/modules.d/nginx.yml

- name: Enable and start Filebeat
  service:
    name: filebeat
    state: started
    enabled: yes
