- name: Install Zabbix agent
  apt:
    name: zabbix-agent
    state: present
    update_cache: yes

- name: Configure Zabbix agent Server
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^Server='
    line: "Server={{ zabbix_server_hostname }}"
  notify: Restart Zabbix agent

- name: Configure Zabbix agent ServerActive
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^ServerActive='
    line: "ServerActive={{ zabbix_server_hostname }}"
  notify: Restart Zabbix agent

- name: Ensure Zabbix agent is enabled and running
  service:
    name: zabbix-agent
    state: started
    enabled: yes
